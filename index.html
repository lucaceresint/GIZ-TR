<script>
"use strict";
/* ============================== utilidades ============================== */
const nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1, minimumFractionDigits:1});
const nf2 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2, minimumFractionDigits:2});
const fmt = (v,d=0)=> v==null||!isFinite(v) ? '–' : (d===0?nf0:d===1?nf1:nf2).format(v);
const pct = v => v==null||!isFinite(v) ? '–' : nf1.format(v*100)+'%';
function compact(v){ if(v==null||!isFinite(v)) return '–'; const a=Math.abs(v);
  const g=(x,u)=>(Math.abs(x)<10&&x%1?nf1:nf0).format(x)+u;
  if(a>=1e9) return g(v/1e9,' bi'); if(a>=1e6) return g(v/1e6,' mi'); if(a>=1e4) return g(v/1e3,' mil'); return nf0.format(v); }
const uniq = a => [...new Set(a)];
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SLOTS = () => [1,2,3,4,5,6,7,8].map(i=>css('--s'+i));

function h(tag, attrs={}, kids=[]){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v; else if (k==='text') e.textContent=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  for (const c of [].concat(kids)) if (c!=null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
function sel(label, options, value, onchange, id){
  const s = h('select', {id, onchange:e=>onchange(e.target.value)});
  for (const o of options){ const [v,t] = Array.isArray(o)?o:[o,o]; const op=h('option',{value:v,text:t}); if(String(v)===String(value)) op.selected=true; s.append(op); }
  return h('div',{class:'f'},[h('label',{for:id,text:label}), s]);
}
function num(label, value, min, max, onchange, id){
  const i = h('input',{type:'number',id,value,min,max,step:1,onchange:e=>{let v=+e.target.value; v=Math.max(min,Math.min(max,v)); e.target.value=v; onchange(v);}});
  return h('div',{class:'f'},[h('label',{for:id,text:label}), i]);
}
/* multi-seleção cumulativa (o painel continua aberto entre cliques) */
let OPEN_DD = null;
function multi(label, options, selected, onchange, presets=[], id){
  const opts = options.map(o=>Array.isArray(o)?o:[o,o]);
  const lab = Object.fromEntries(opts);
  const wrap = h('div',{class:'f dd'});
  const btn = h('button',{type:'button','aria-haspopup':'true','aria-expanded':'false'});
  const panel = h('div',{class:'panel',hidden:true});
  let cur = new Set(selected);
  const upd = () => { const s=opts.filter(o=>cur.has(o[0])).map(o=>o[1]);
    btn.textContent = s.length===0 ? 'Nenhum' : s.length===opts.length&&opts.length>2 ? `Todos (${s.length})` : s.length<=2 ? s.map(x=>x.length>28?x.slice(0,26)+'…':x).join(' + ') : `${s.length} selecionados`; };
  const boxes = [];
  const acts = h('div',{class:'acts'});
  const apply = s => { cur = new Set(s); boxes.forEach(b=>b.checked=cur.has(b.value)); upd(); OPEN_DD=id||null; onchange(opts.map(o=>o[0]).filter(v=>cur.has(v))); };
  for (const [t,fn] of presets) acts.append(h('button',{type:'button',text:t,onclick:()=>apply(fn())}));
  acts.append(h('button',{type:'button',text:'Todos',onclick:()=>apply(opts.map(o=>o[0]))}));
  acts.append(h('button',{type:'button',text:'Limpar',onclick:()=>apply([])}));
  panel.append(acts);
  for (const [v,t] of opts){
    const cb = h('input',{type:'checkbox',value:v}); cb.checked = cur.has(v); boxes.push(cb);
    cb.addEventListener('change',()=>{ cb.checked?cur.add(v):cur.delete(v); upd(); OPEN_DD=id||null; onchange(opts.map(o=>o[0]).filter(x=>cur.has(x))); });
    panel.append(h('label',{class:'opt'},[cb, t]));
  }
  btn.addEventListener('click',e=>{ e.stopPropagation(); const open = panel.hidden; document.querySelectorAll('.dd .panel').forEach(p=>p.hidden=true); panel.hidden=!open; OPEN_DD = open?(id||null):null; btn.setAttribute('aria-expanded',String(open)); });
  panel.addEventListener('click',e=>e.stopPropagation());
  if (id && OPEN_DD===id){ panel.hidden=false; btn.setAttribute('aria-expanded','true'); }
  upd();
  wrap.append(h('span',{class:'lab',text:label}), btn, panel);
  return wrap;
}
document.addEventListener('click',()=>{ OPEN_DD=null; document.querySelectorAll('.dd .panel').forEach(p=>p.hidden=true); });
const asArr = v => Array.isArray(v) ? v : [v];
const joinSel = (sel, all, plural) => sel.length===all.length && all.length>1 ? plural : sel.join(' + ');

/* cores estáveis: a mesma categoria tem sempre a mesma cor, qualquer que seja a seleção */
const FIX = {
  mineral: {'Nióbio':0,'Tântalo':1,'Terras raras':2,'Nióbio (código misto)':3,'Nióbio / Tântalo (código misto)':4},
  serie:   {'Nióbio (Nb2O5)':0,'Columbita-Tantalita (Ta2O5)':1,'Monazita e Terras-Raras (ETR)':2,'Columbita-Tantalita (Nb2O5)':6},
  fluxo:   {'Exportação':0,'Importação':1,'Produção':2},
  iso:     {'BRA':1,'CHN':6,'USA':0}
};
const DOM = {};
function colorsFor(dim, keys){
  const C=SLOTS(), fx=FIX[dim]||{}, d=DOM[dim]||[], used=new Set(), out={};
  keys.forEach(k=>{ if(fx[k]!=null && !used.has(fx[k])){ out[k]=C[fx[k]]; used.add(fx[k]); } });
  keys.forEach(k=>{ if(out[k]) return; let i=d.indexOf(k); if(i<0) i=d.length+keys.indexOf(k);
    let s=i%8, n=0; while(used.has(s)&&n<8){ s=(s+1)%8; n++; } used.add(s); out[k]=C[s]; });
  return out;
}


/* ---------- tabela + exportação ---------- */
function tableBlock(title, cols, rows, opts={}){
  // cols: [{k,label,fmt?,txt?}] ; rows: objetos ; opts.long: [{sheet, cols, rows}] ; opts.file
  const tb = h('table');
  const thead = h('thead'), trh = h('tr');
  cols.forEach(c=>trh.append(h('th',{class:c.txt?'txt':'',text:c.label})));
  thead.append(trh); tb.append(thead);
  const tbody = h('tbody');
  for (const r of rows){
    const tr = h('tr',{class:r._tot?'tot':''});
    for (const c of cols){
      const v = r[c.k];
      const td = h('td',{class:c.txt?'txt':''});
      td.textContent = c.fmt ? c.fmt(v, r) : (v==null?'–':v);
      const fl = r['_fl_'+c.k];
      if (fl) { td.append(h('sup',{class:'fl',text:fl})); td.title = 'flag: '+fl; }
      tr.append(td);
    }
    tbody.append(tr);
  }
  tb.append(tbody);
  const file = opts.file || 'painel_etr_nb_ta';
  // matriz (aoa) preserva a ordem das colunas mesmo com rótulos numéricos (anos)
  const plain = () => { const flagged = cols.filter(c=>rows.some(r=>r['_fl_'+c.k]));
    const header = []; cols.forEach(c=>{ header.push(c.label); if(flagged.includes(c)) header.push(c.label+' (flag)'); });
    const body = rows.map(r=>{ const a=[]; cols.forEach(c=>{ a.push(r[c.k]==null?'':r[c.k]); if(flagged.includes(c)) a.push(r['_fl_'+c.k]||''); }); return a; });
    return {aoa:[header].concat(body)}; };
  const bar = h('div',{class:'tablebar'},[
    h('span',{class:'t',text:title}),
    h('div',{class:'b'},[
      h('button',{class:'btn',type:'button',text:'Exportar CSV',onclick:()=>downloadCSV(plain(), file+'.csv')}),
      h('button',{class:'btn primary',type:'button',text:'Exportar Excel',onclick:()=>{
        const sheets = [{name:'tabela', rows:plain()}].concat((opts.long||[]).map(s=>({name:s.sheet, rows:s.rows})));
        downloadXLSX(sheets, file+'.xlsx');
      }})
    ])
  ]);
  return h('div',{},[bar, h('div',{class:'tw'},[tb])]);
}
function toAoa(rows){ if (rows && rows.aoa) return rows.aoa; if (!rows.length) return [];
  const cols = []; rows.forEach(r=>Object.keys(r).forEach(k=>{ if(!cols.includes(k)) cols.push(k); }));
  return [cols].concat(rows.map(r=>cols.map(c=>r[c]))); }
function downloadCSV(rows, name){
  const aoa = toAoa(rows); if (!aoa.length) return;
  const esc = v => { if (v==null) return ''; if (typeof v==='number') return String(v).replace('.',','); const s=String(v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt = '﻿' + aoa.map(r=>r.map(esc).join(';')).join('\r\n');
  saveBlob(new Blob([txt],{type:'text/csv;charset=utf-8'}), name);
}
function downloadXLSX(sheets, name){

  XLSX.writeFile(wb, name);
}
function saveBlob(blob, name){ const a=h('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
/* ---------- gráficos ---------- */
const CHARTS = {};
const crosshair = { id:'crosshair', afterDatasetsDraw(c){ const a=c.tooltip&&c.tooltip.getActiveElements(); if(!a||!a.length||c.config.type!=='line') return;

const tipLabels = { id:'tipLabels', afterDatasetsDraw(c, args, o){ if(!o||!o.on) return; const ctx=c.ctx; ctx.save(); ctx.font='12px system-ui,-apple-system,Segoe UI,sans-serif'; ctx.fillStyle=css('--text-2'); ctx.textBaseline='middle';
  c.data.datasets.forEach((ds,i)=>{ const m=c.getDatasetMeta(i); if(m.hidden) return; m.data.forEach((el,j)=>{ const v=ds.data[j]; if(v==null) return; const t=o.fmt(v,j); ctx.textAlign='left'; ctx.fillText(t, el.x+6, el.y); }); }); ctx.restore(); } };
function baseOpts(kind, yfmt, extra={}){
  const txt=css('--text-2'), mut=css('--muted'), grid=css('--grid'), axis=css('--axis'), surf=css('--surface');
  Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",sans-serif'; Chart.defaults.font.size = 12; Chart.defaults.color = txt;
  const horiz = extra.indexAxis==='y';
  const valAxis = { grid:{color:grid, drawTicks:false}, border:{display:false}, ticks:{color:mut, padding:6, callback:v=>yfmt(v)}, beginAtZero: kind==='bar' || extra.zero };
  const catAxis = { grid:{display:false}, border:{color:axis}, ticks:{color:mut, autoSkip:!horiz, maxRotation:0} };
  return Object.assign({
    indexAxis: horiz?'y':'x',
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction: horiz ? {mode:'nearest', axis:'y', intersect:true} : (kind==='line'?{mode:'index',intersect:false}:{mode:'nearest',axis:'x',intersect:true}),
    layout:{padding:{right: extra.padRight||8, top:4}},
    plugins:{
      legend:{display: extra.legend!==false, position:'top', align:'start', labels:{color:txt, usePointStyle:false, boxWidth: kind==='line'?18:10, boxHeight: kind==='line'?2:10, padding:14}},
      tooltip:{backgroundColor:css('--surface'), titleColor:css('--text'), bodyColor:css('--text'), borderColor:css('--ring'), borderWidth:1, padding:10, usePointStyle:true,
        itemSort:(a,b)=>(b.raw??-Infinity)-(a.raw??-Infinity),
        callbacks:{ label: ctx => `${yfmt(ctx.raw, true)}  ${ctx.dataset.label}`, labelPointStyle: ()=>({pointStyle: kind==='line'?'line':'rect', rotation:0}) } },
      tipLabels: extra.tipLabels || {on:false}
    },
    scales: horiz ? {x:valAxis, y:catAxis} : {x:catAxis, y:valAxis}
  }, extra.options||{});
}
function lineDS(label, data, color, emph=true){

    pointBorderColor:css('--surface'), pointBorderWidth:2, borderJoinStyle:'round', borderCapStyle:'round', tension:0, spanGaps:false};

function drawChart(id, cfg){

const bgFill = { id:'bgFill', beforeDraw(c){ const ctx=c.ctx; ctx.save(); ctx.globalCompositeOperation='destination-over'; ctx.fillStyle=css('--surface'); ctx.fillRect(0,0,c.width,c.height); ctx.restore(); } };
const slug = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,80).toLowerCase();
function chartDataAoa(id){

function chartCard(title, sub, id, tall=false){

const tile = (l,v,s) => h('div',{class:'tile'},[h('div',{class:'l',text:l}), h('div',{class:'v',text:v}), s?h('div',{class:'s',text:s}):null]);

/* ============================== dados (v7 – reprodução das bases) ============================== */
const RAW = JSON.parse(document.getElementById('data').textContent);
function unpack(p){ const out=new Array(p.rows.length); for(let i=0;i<p.rows.length;i++){ const r=p.rows[i],o={}; for(let j=0;j<p.cols.length;j++){ const c=p.cols[j],d=p.dict[c]; o[c]=d?d[r[j]]:r[j]; } out[i]=o; } return out; }
const ANM = unpack(RAW.anm), OF = unpack(RAW.oferta), RS = unpack(RAW.reservas), CX = unpack(RAW.comex), CT = unpack(RAW.comtrade);

/* "Quantidade/valor de consumo/utilização" fica fora: é zero em todos os registros das três substâncias */
const VARS = [['producao','Quantidade produção (t)'],['contido','Quantidade contido (t de óxido)'],['venda_t','Quantidade venda (t)'],['venda_rs','Valor venda (R$)'],
              ['transf_t','Quantidade transferência p/ transformação (t)'],['transf_rs','Valor transferência p/ transformação (R$)']];
const VLAB = Object.fromEntries(VARS);
const MINERAIS = ['Terras raras','Nióbio','Tântalo'];
const UNID = {'Terras raras':'t REO','Nióbio':'t Nb contido','Tântalo':'t Ta contido'};
const UCONT = {'Terras raras':'t REO','Nióbio':'t Nb','Tântalo':'t Ta'};
const unidMulti = ms => ms.length===1 ? UNID[ms[0]] : 't de conteúdo (' + ms.map(m=>UCONT[m]).join(' + ') + ')';
const sortMin = ms => MINERAIS.filter(m=>ms.includes(m));
function alertNote(rows){
  const e=rows.filter(r=>/^Erro provável/.test(r.alerta||'')).length, v=rows.filter(r=>/^A verificar/.test(r.alerta||'')).length;
  if(!e&&!v) return null;
  const parts=[e?`${e} registro(s) com "erro provável"`:null, v?`${v} registro(s) "a verificar"`:null].filter(Boolean).join(' e ');
  return h('div',{class:'note',text:`A seleção inclui ${parts}. Esses registros estão nos gráficos e nas tabelas como publicados; veja a coluna "Alerta" e a aba Fontes e notas.`});
}
/* domínios estáveis para as cores */
const rankBy = (rows, key, val) => { const t={}; rows.forEach(r=>{ const k=key(r); t[k]=(t[k]||0)+(val(r)||0); }); return Object.keys(t).sort((a,b)=>t[b]-t[a]); };
DOM.uf = rankBy(ANM, r=>r.uf, r=>r.contido);
DOM.ncm = rankBy(CX, r=>r.ncm, r=>r.usd);
DOM.parceiro = rankBy(CX, r=>r.pais, r=>r.usd);
DOM.iso = uniq(rankBy(OF.filter(r=>r.tipo==='País'), r=>r.iso3, r=>r.producao).concat(rankBy(CT, r=>r.iso3, r=>r.usd)));

/* ============================== aba BRASIL (ANM) ============================== */
const SB = {base:'Beneficiada', subst:null, oxNot:new Set(), ufNot:new Set(), v:'contido', de:2010, ate:2025, abrir:'serie'};
function renderBR(){
  const sec=document.getElementById('brasil'); sec.replaceChildren();
  const substs = uniq(ANM.map(r=>r.substancia)).sort();
  if (!SB.subst) SB.subst = substs.slice();
  const inS = r=>SB.subst.includes(r.substancia);
  const oxs = uniq(ANM.filter(inS).map(r=>r.oxido)).filter(Boolean).sort();
  const ufs = uniq(ANM.filter(inS).map(r=>r.uf)).sort();
  const oxSel = oxs.filter(o=>!SB.oxNot.has(o)), ufSel = ufs.filter(u=>!SB.ufNot.has(u));
  const yrs = range(Math.min(SB.de,SB.ate), Math.max(SB.de,SB.ate));
  const rows = ANM.filter(r=>r.base===SB.base&&inS(r)&&oxSel.includes(r.oxido)&&ufSel.includes(r.uf)&&r.ano>=yrs[0]&&r.ano<=yrs[yrs.length-1]);
  const varsOk = VARS.filter(([k])=>rows.some(r=>r[k]));
  if (!varsOk.some(v=>v[0]===SB.v)) SB.v = (varsOk.find(v=>v[0]==='contido')||varsOk[0]||VARS[1])[0];
  sec.append(h('div',{class:'filters'},[
    sel('Base', [['Beneficiada','Produção beneficiada'],['Bruta (ROM)','Produção bruta (ROM)']], SB.base, v=>{SB.base=v; renderBR();}, 'b-base'),
    multi('Substância', substs, SB.subst, v=>{SB.subst=v; renderBR();}, [], 'b-sub'),
    multi('Contido em', oxs, oxSel, v=>{ oxs.forEach(o=>v.includes(o)?SB.oxNot.delete(o):SB.oxNot.add(o)); renderBR();}, [], 'b-ox'),
    multi('UF', ufs, ufSel, v=>{ ufs.forEach(u=>v.includes(u)?SB.ufNot.delete(u):SB.ufNot.add(u)); renderBR();}, [], 'b-uf'),
    sel('Variável do gráfico', varsOk.length?varsOk:VARS, SB.v, v=>{SB.v=v; renderBR();}, 'b-v'),
    sel('Abrir gráfico por', [['serie','Substância / contido'],['uf','UF'],['nenhum','Sem abertura']], SB.abrir, v=>{SB.abrir=v; renderBR();}, 'b-ab'),
    num('De', SB.de, 2010, 2025, v=>{SB.de=v; renderBR();}, 'b-de'), num('Até', SB.ate, 2010, 2025, v=>{SB.ate=v; renderBR();}, 'b-ate')
  ]));
  const an = alertNote(rows); if (an) sec.append(an);
  const key = r => SB.abrir==='uf' ? r.uf : SB.abrir==='serie' ? `${r.substancia} (${r.oxido||'–'})` : 'Total';
  const keys = uniq(rows.map(key)); const tot = k=>rows.filter(r=>key(r)===k).reduce((a,r)=>a+(r[SB.v]||0),0);
  keys.sort((a,b)=>tot(b)-tot(a));
  const shown = keys.slice(0,7), other = keys.slice(7);
  const cm = SB.abrir==='nenhum' ? {Total:SLOTS()[0]} : colorsFor(SB.abrir==='uf'?'uf':'serie', shown);
  const isRS = /_rs$/.test(SB.v), yf = (v,full)=> (isRS?'R$ ':'')+(full?fmt(v):compact(v));
  const ds = shown.map(k=>barDS(k, yrs.map(y=>rows.filter(r=>key(r)===k&&r.ano===y).reduce((a,r)=>a+(r[SB.v]||0),0)), cm[k]));
  if (other.length) ds.push(barDS('Demais', yrs.map(y=>rows.filter(r=>other.includes(key(r))&&r.ano===y).reduce((a,r)=>a+(r[SB.v]||0),0)), css('--other')));
  const mixOx = SB.v==='contido' && uniq(rows.map(r=>r.oxido)).length>1;
  const sLab = SB.subst.length===substs.length ? 'todas as substâncias' : SB.subst.length ? SB.subst.join(' + ') : 'nenhuma substância';
  sec.append(chartCard(`${VLAB[SB.v]} – ${sLab}${ufSel.length===ufs.length?'':' · '+ufSel.join(', ')}`, `ANM – Anuário Mineral Brasileiro · ${SB.base==='Beneficiada'?'produção beneficiada':'produção bruta (ROM)'} · ${yrs[0]}–${yrs[yrs.length-1]}`+(mixOx?' · atenção: soma óxidos diferentes (Nb₂O₅, Ta₂O₅, ETR)':''), 'c-br'));
  const o = baseOpts('bar', yf); if (ds.length>1){ o.scales.x.stacked=true; o.scales.y.stacked=true; } else o.plugins.legend.display=false;
  drawChart('c-br', {type:'bar', data:{labels:yrs, datasets:ds}, options:o});
  const cols = [{k:'ano',label:'Ano'},{k:'uf',label:'UF',txt:true},{k:'substancia',label:'Substância',txt:true},{k:'oxido',label:'Contido em',txt:true}]
    .concat(VARS.map(([k,l])=>({k,label:l,fmt:v=>fmt(v, v!=null&&Math.abs(v)<10&&v%1?2:0)}))).concat([{k:'alerta',label:'Alerta',txt:true}]);
  const trows = rows.slice().sort((a,b)=>a.ano-b.ano||a.substancia.localeCompare(b.substancia)||a.oxido.localeCompare(b.oxido)||a.uf.localeCompare(b.uf));
  sec.append(h('div',{class:'card'},[h('h2',{text:'Base de dados – ANM'}),
    h('p',{class:'sub',text:'Reprodução da base no nível de detalhe original (ano × UF × substância × óxido contido), com todos os registros como publicados. Quantidades em toneladas; contido em toneladas do óxido indicado; valores em R$ correntes. Consumo/utilização não aparece porque é zero em todos os registros.'}),
    tableBlock(`${fmt(trows.length)} registros`, cols, trows, {file:`anm_${SB.base}`.replace(/[\s()]+/g,'_')})]));
}

/* ============================== aba MUNDO (USGS) ============================== */
const SM = {mineral:['Nióbio'], variavel:'prod', paises:null, de:2008, ate:2025};
function renderMundo(){
  const sec=document.getElementById('mundo'); sec.replaceChildren();
  const isR = SM.variavel==='res', ms = sortMin(SM.mineral);
  const src = isR ? RS.filter(r=>ms.includes(r.mineral)).map(r=>({m:r.mineral,pais:r.pais,tipo:r.tipo,iso3:r.iso3,ano:r.edicao_mcs,v:r.reservas,obs:r.limite_inferior}))
                  : OF.filter(r=>ms.includes(r.mineral)).map(r=>({m:r.mineral,pais:r.pais,tipo:r.tipo,iso3:r.iso3,ano:r.ano,v:r.producao,obs:r.estimado==='Sim'?'estimado':''}));
  /* soma por país × ano entre os minerais escolhidos; o total mundial só existe se todos os minerais o publicam */
  const agg={}; src.forEach(r=>{ const k=r.pais+'|'+r.ano; const o=(agg[k]=agg[k]||{pais:r.pais,tipo:r.tipo,iso3:r.iso3,ano:r.ano,v:null,n:0});
    if(r.v!=null){ o.v=(o.v||0)+r.v; o.n++; } });
  const rows = Object.values(agg).map(o=> o.tipo!=='País' && o.n<ms.length ? Object.assign(o,{v:null}) : o);
  sec.append(h('div',{class:'filters'},[
    multi('Mineral', MINERAIS, ms, v=>{SM.mineral=v; SM.paises=null; renderMundo();}, [], 'm-min'),
    sel('Variável', [['prod','Produção de mina'],['res','Reservas (por edição do MCS)']], SM.variavel, v=>{SM.variavel=v; SM.paises=null; SM.de=0; SM.ate=9999; renderMundo();}, 'm-var')
  ]));
  if (!ms.length){ sec.append(h('div',{class:'note',text:'Selecione ao menos um mineral.'})); return; }
  const anos = uniq(rows.map(r=>r.ano)).sort((a,b)=>a-b), amin=anos[0], amax=anos[anos.length-1];
  SM.de=Math.max(amin,Math.min(SM.de,amax)); SM.ate=Math.min(amax,Math.max(SM.ate,amin)); if(SM.de>SM.ate)[SM.de,SM.ate]=[amin,amax];
  const yrs = anos.filter(a=>a>=SM.de&&a<=SM.ate), last = yrs[yrs.length-1] === 2025 && !isR ? 2024 : yrs[yrs.length-1];
  const allP = uniq(rows.filter(r=>r.tipo==='País').map(r=>r.pais));
  const val = (p,y)=>{ const r=agg[p+'|'+y]; return r&&r.v!=null?r.v:null; };
  const vl = p=>{ const v=val(p,last); return v==null?-1:v; };
  allP.sort((a,b)=>vl(b)-vl(a)||a.localeCompare(b));
  const top = ()=>{ const t=allP.slice(0,5); if(!t.includes('Brasil')&&allP.includes('Brasil')) t.push('Brasil'); return t; };
  if (!SM.paises || !SM.paises.some(p=>allP.includes(p))) SM.paises = top();
  const chosen = allP.filter(p=>SM.paises.includes(p));
  const fl = sec.querySelector('.filters');
  fl.append(multi('Países', allP, chosen, v=>{SM.paises=v; renderMundo();}, [['Top 5 + Brasil', top]], 'm-pais'),
    num('De', SM.de, amin, amax, v=>{SM.de=v; renderMundo();}, 'm-de'), num('Até', SM.ate, amin, amax, v=>{SM.ate=v; renderMundo();}, 'm-ate'));
  const U = unidMulti(ms);
  if (ms.length>1) sec.append(h('div',{class:'note',text:`Soma de ${ms.join(', ')} em toneladas de conteúdo (${ms.map(m=>UCONT[m]).join(' + ')}): útil para escala agregada, mas mistura minerais diferentes.`}));
  const W = y=>val('Total mundial',y), br=val('Brasil',last), w=W(last);
  const rk = allP.map(p=>[p,val(p,last)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]), pos=rk.findIndex(x=>x[0]==='Brasil');
  sec.append(h('div',{class:'tiles'},[
    tile(`Mundo, ${isR?'MCS ':''}${last}`, compact(w), U+(w==null&&isR?' · sem total publicado para o tântalo':'')),
    tile(`Brasil, ${isR?'MCS ':''}${last}`, compact(br), U),
    tile('Participação do Brasil', pct(br&&w?br/w:null), ''),
    tile('Posição do Brasil', pos>=0?`${pos+1}º`:'–', `entre ${rk.length} países`)
  ]));
  const isoOf = {}; rows.forEach(r=>isoOf[r.pais]=r.iso3);
  const pl = chosen.slice(0,8), ci = colorsFor('iso', pl.map(p=>isoOf[p]));
  sec.append(chartCard(`${isR?'Reservas':'Produção de mina'} – ${ms.join(' + ')} (${U})`, `USGS – Mineral Commodity Summaries${isR?' (valor de cada edição)':' · 2025 = estimativa'}`, 'c-mu'));
  drawChart('c-mu',{type:'line', data:{labels:yrs.map(y=>isR?'MCS '+y:y), datasets: pl.map(p=>Object.assign(lineDS(p, yrs.map(y=>val(p,y)), ci[isoOf[p]]), isR?{stepped:'before'}:{}))}, options: baseOpts('line',(v,full)=>full?fmt(v):compact(v),{zero:true})});
  const cols=[{k:'pais',label:'País',txt:true},{k:'iso3',label:'ISO3',txt:true}].concat(yrs.map(y=>({k:'y'+y,label:(isR?'MCS ':'')+y+(y===2025&&!isR?' (e)':''),fmt:v=>fmt(v)})));
  const trows = chosen.map(p=>{ const o={pais:p, iso3:isoOf[p]}; yrs.forEach(y=>o['y'+y]=val(p,y)); return o; });
  if (yrs.some(y=>W(y)!=null)){ const t={pais:'Total mundial',iso3:'WLD',_tot:true}; yrs.forEach(y=>t['y'+y]=W(y)); trows.push(t); }
  const longR = src.filter(r=>yrs.includes(r.ano)).map(r=>({mineral:r.m, variavel:isR?'Reservas':'Produção de mina', pais:r.pais, iso3:r.iso3, tipo:r.tipo, ano:r.ano, valor:r.v, unidade:UNID[r.m], obs:r.obs}));
  sec.append(h('div',{class:'card'},[h('h2',{text:'Base de dados – USGS'}), h('p',{class:'sub',text:'Países selecionados e total mundial. O Excel inclui todos os países e minerais escolhidos, separados, na aba "todos_os_paises".'}),
    tableBlock(`${chosen.length} países · ${U}`, cols, trows, {file:`usgs_${ms.join('_')}_${isR?'reservas':'producao'}`.replace(/\s+/g,'_'), long:[{sheet:'todos_os_paises', rows:longR}]})]));
}

/* ============================== aba BRASIL · COMEXSTAT ============================== */
const SC = {fluxo:'Exportação', mineral:null, ncmNot:new Set(), medida:'t', abrir:'ncm', de:2010, ate:2025};
function renderCX(){
  const sec=document.getElementById('comex'); sec.replaceChildren();
  const mins=uniq(CX.map(r=>r.mineral)).sort();
  if (!SC.mineral) SC.mineral = mins.slice();
  const ncms=uniq(CX.filter(r=>SC.mineral.includes(r.mineral)).map(r=>r.ncm)).sort();
  const ncmSel = ncms.filter(n=>!SC.ncmNot.has(n));
  const desc={}; CX.forEach(r=>desc[r.ncm]=r.descricao);

    sel('Medida', [['t','Peso líquido (t)'],['usd','Valor (US$ FOB)']], SC.medida, v=>{SC.medida=v; renderCX();}, 'c-med')];

  const M=SC.medida, yf=(v,full)=>(M==='usd'?'US$ ':'')+(full?fmt(v,M==='t'?1:0):compact(v))+(M==='t'?' t':'');
  const sum=(f,y)=>rows.filter(r=>f(r)&&r.ano===y).reduce((a,r)=>a+sgn(r)*(r[M]||0),0);
  let ds;

  } else {

    const keys=uniq(rows.map(key)).sort((a,b)=>tot(b)-tot(a)), shown=keys.slice(0,7), other=keys.slice(7);

  }

  const mLab = SC.mineral.length===mins.length ? 'todos os minerais' : SC.mineral.join(' + ');
  sec.append(chartCard(`${tit} – ${M==='t'?'peso líquido (t)':'valor (US$ FOB)'}`, `MDIC – Comexstat · ${mLab} · ${ncmSel.length} NCM · ${yrs[0]}–${yrs[yrs.length-1]}`+(M==='t'&&ncmSel.length>1?' · em toneladas, a soma mistura produtos diferentes':''), 'c-cx'));
  const o=baseOpts('bar',yf); if(SC.fluxo!=='Ambos'&&ds.length>1){o.scales.x.stacked=true;o.scales.y.stacked=true;} if(ds.length===1) o.plugins.legend.display=false;
  drawChart('c-cx',{type:'bar',data:{labels:yrs,datasets:ds},options:o});
  const cols=[{k:'ano',label:'Ano'},{k:'fluxo',label:'Fluxo',txt:true},{k:'pais',label:'País parceiro',txt:true},{k:'ncm',label:'NCM',txt:true},{k:'descricao',label:'Descrição NCM',txt:true},{k:'mineral',label:'Mineral',txt:true},{k:'elo',label:'Elo da cadeia',txt:true},
    {k:'t',label:'Peso líquido (t)',fmt:v=>fmt(v,v!=null&&Math.abs(v)<10&&v%1?3:1)},{k:'usd',label:'Valor (US$ FOB)',fmt:v=>fmt(v)},{k:'alerta',label:'Alerta',txt:true}];
  const trows=rows.slice().sort((a,b)=>a.ano-b.ano||a.fluxo.localeCompare(b.fluxo)||a.ncm.localeCompare(b.ncm)||(b.usd||0)-(a.usd||0));
  const blk=tableBlock(`${fmt(trows.length)} registros${trows.length>500?' · prévia dos 500 primeiros (a exportação leva todos)':''}`, cols, trows.slice(0,500), {file:'comexstat'});

  blk.querySelectorAll('.tablebar .b button').forEach((b,i)=>{ const c=b.cloneNode(true); b.replaceWith(c); c.addEventListener('click',()=> i===0?downloadCSV(plain(),'comexstat.csv'):downloadXLSX([{name:'comexstat',rows:plain()}],'comexstat.xlsx')); });
  sec.append(h('div',{class:'card'},[h('h2',{text:'Base de dados – Comexstat'}),

/* ============================== abas de produção mundial por país (BGS e WMD) ============================== */
/* gráfico de linhas por país + tabela país × ano; mesma lógica da aba USGS */
function countryTab(cfg){
  const {sec, rows, S, title, source, unit, file, intro, filters, longCols} = cfg;
  const anos = uniq(rows.map(r=>r.ano)).sort((a,b)=>a-b);
  if (!anos.length){ sec.append(h('div',{class:'note',text:'Sem dados para a seleção.'})); return; }
  const amin=anos[0], amax=anos[anos.length-1];
  if (S.de==null||S.de<amin||S.de>amax) S.de = Math.max(amin, amax-14); if (S.ate==null||S.ate>amax||S.ate<amin) S.ate=amax; if (S.de>S.ate)[S.de,S.ate]=[amin,amax];
  const yrs=anos.filter(a=>a>=S.de&&a<=S.ate), last=yrs[yrs.length-1];
  const agg={}, isoOf={};
  rows.forEach(r=>{ if(r.pais==='Total mundial') return; const k=r.pais+'|'+r.ano; agg[k]=(agg[k]||0)+(r.v||0); isoOf[r.pais]=r.iso3||r.pais; });
  const tot={}; rows.filter(r=>r.pais==='Total mundial').forEach(r=>tot[r.ano]=(tot[r.ano]||0)+(r.v||0));
  const val=(p,y)=>agg[p+'|'+y]??null;
  const allP=uniq(rows.filter(r=>r.pais!=='Total mundial').map(r=>r.pais));
  const vl=p=>{ const v=val(p,last); return v==null?-1:v; }; allP.sort((a,b)=>vl(b)-vl(a)||a.localeCompare(b));
  const br=allP.find(p=>/^Bra[sz]il$/.test(p));
  const top=()=>{ const t=allP.slice(0,5); if(br&&!t.includes(br)) t.push(br); return t; };
  if (!S.paises||!S.paises.some(p=>allP.includes(p))) S.paises=top();
  const chosen=allP.filter(p=>S.paises.includes(p));
  sec.append(h('div',{class:'filters'},filters.concat([
    multi('Países', allP, chosen, v=>{S.paises=v; S._r();}, [['Top 5 + Brasil', top]], S._id+'-pais'),
    num('De', S.de, amin, amax, v=>{S.de=v; S._r();}, S._id+'-de'), num('Até', S.ate, amin, amax, v=>{S.ate=v; S._r();}, S._id+'-ate')])));
  (intro||[]).forEach(t=>sec.append(h('div',{class:'note',text:t})));
  const an=alertNote(rows.filter(r=>yrs.includes(r.ano))); if(an) sec.append(an);
  const pl=chosen.slice(0,8), ci=colorsFor('iso', pl.map(p=>isoOf[p]));
  sec.append(chartCard(title, `${source} · ${yrs[0]}–${last}`, S._id+'-c'));
  drawChart(S._id+'-c',{type:'line', data:{labels:yrs, datasets:pl.map(p=>lineDS(p, yrs.map(y=>val(p,y)), ci[isoOf[p]]))}, options: baseOpts('line',(v,full)=>full?fmt(v):compact(v),{zero:true})});
  const cols=[{k:'pais',label:'País',txt:true}].concat(yrs.map(y=>({k:'y'+y,label:String(y),fmt:v=>fmt(v)})));
  const trows=chosen.map(p=>{ const o={pais:p}; yrs.forEach(y=>o['y'+y]=val(p,y)); return o; });
  if (Object.keys(tot).length){ const t={pais:'Total mundial (publicado)',_tot:true}; yrs.forEach(y=>t['y'+y]=tot[y]??null); trows.push(t); }
  sec.append(h('div',{class:'card'},[h('h2',{text:`Base de dados – ${source.split(' – ')[0]}`}), h('p',{class:'sub',text:'Países selecionados. O Excel traz todos os registros da seleção, no nível original, na aba "base".'}),
    tableBlock(`${chosen.length} países · ${unit}`, cols, trows, {file, long:[{sheet:'base', rows:rows.filter(r=>yrs.includes(r.ano)).map(longCols)}]})]));
}

const BG = unpack(RAW.bgs);
const SG = {tabela:'Nióbio e tântalo – minerais', medida:'Concentrado (peso bruto)', min:null, paises:null, de:null, ate:null, _id:'g', _r:()=>renderBGS()};
function renderBGS(){
  const sec=document.getElementById('bgs'); sec.replaceChildren();
  const tabs=uniq(BG.map(r=>r.tabela)).sort();
  const meds=uniq(BG.filter(r=>r.tabela===SG.tabela).map(r=>r.medida)).sort(); if(!meds.includes(SG.medida)) SG.medida=meds[0];
  const base=BG.filter(r=>r.tabela===SG.tabela&&r.medida===SG.medida);
  const mins=uniq(base.map(r=>r.minerio)).sort(); if(!SG.min||!SG.min.some(m=>mins.includes(m))) SG.min=mins.slice();
  const msel=mins.filter(m=>SG.min.includes(m));
  const rows=base.filter(r=>msel.includes(r.minerio)).map(r=>Object.assign({v:r.t},r));
  const intro=[];
  if (SG.medida==='Concentrado (peso bruto)') intro.push('Peso bruto do concentrado (mineral + ganga), não conteúdo do metal. Para comparar com USGS e ANM, use as medidas "Conteúdo de Nb" ou "Conteúdo de Ta", ou a tabela de óxidos de terras raras.');
  if (SG.tabela.startsWith('Terras raras – minerais')) intro.push('Tabela descontinuada pelo BGS a partir da edição 2005–2009 (substituída pela de óxidos), com poucos países nos anos recentes.');
  countryTab({sec, rows, S:SG, title:`${SG.tabela} – ${SG.medida} (t)`, source:'BGS – World Mineral Statistics', unit:'t', file:`bgs_${slug(SG.tabela)}_${slug(SG.medida)}`, intro,
    filters:[sel('Tabela', tabs, SG.tabela, v=>{SG.tabela=v; SG.min=null; SG.paises=null; renderBGS();}, 'g-tab'),
             sel('Medida', meds, SG.medida, v=>{SG.medida=v; SG.min=null; SG.paises=null; renderBGS();}, 'g-med'),
             multi('Minério', mins, msel, v=>{SG.min=v; renderBGS();}, [], 'g-min')],
    longCols:r=>({tabela:r.tabela, medida:r.medida, minerio:r.minerio, pais:r.pais, iso3:r.iso3, ano:r.ano, toneladas:r.t, nota_bgs:r.nota, alerta:r.alerta})});
}

/* ============================== navegação ============================== */
const RENDER = {brasil:renderBR, comex:renderCX, mundo:renderMundo, bgs:renderBGS, wmd:renderWMD, comtrade:renderCT, fontes:renderFontes};

let current = 'brasil';
function show(tab){
  current = tab;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
  document.querySelectorAll('main section').forEach(s=>s.hidden = s.id!==tab);
  RENDER[tab]();
  if (location.hash.slice(1)!==tab) history.replaceState(null,'','#'+tab);
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
function setTheme(t){
  try { localStorage.setItem('painel-tema', t); } catch(e){}
  if (t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.t===t)));
  RENDER[current]();
}
document.querySelectorAll('.theme button').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>RENDER[current]());
let t0='auto'; try { t0 = localStorage.getItem('painel-tema') || 'auto'; } catch(e){}
